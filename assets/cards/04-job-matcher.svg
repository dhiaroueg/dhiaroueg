<text x="28" y="76" font-size="23" font-weight="700" fill="#fff">CV Job Matcher</text>
<text x="28" y="110" font-size="13" fill="#E8EEF2" fill-opacity=".9">FastAPI service that parses CVs, gathers live job</text><text x="28" y="129" font-size="13" fill="#E8EEF2" fill-opacity=".9">listings, scores candidate-role matches and writes cover</text><text x="28" y="148" font-size="13" fill="#E8EEF2" fill-opacity=".9">letters, with automatic LLM fallback.</text>
