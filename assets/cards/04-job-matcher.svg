<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1A2A"/><stop offset=".6" stop-color="#14283C"/><stop offset="1" stop-color="#1B3B4A"/></linearGradient></defs>
